name: Format typing feature

on:
  push:
    branches:
      - feat/web-typing-presence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-typing-presence
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/web/app/pulsemesh-client.tsx
          apps/web/hooks/use-pulsemesh-realtime.ts
          apps/web/lib/display.ts
          apps/web/lib/display.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/pulsemesh-client.tsx apps/web/hooks/use-pulsemesh-realtime.ts apps/web/lib/display.ts apps/web/lib/display.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(web): format typing feature"
          git push origin HEAD:feat/web-typing-presence
