name: Format API test

on:
  push:
    branches:
      - fix/web-session-retry
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-session-retry
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/lib/api.test.ts
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/api.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(web): format session retry tests"
          git push origin HEAD:fix/web-session-retry
