name: Generate baseline

on:
  push:
    branches:
      - chore/format-lockfile-baseline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/format-lockfile-baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Promote strict CI baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          lines = path.read_text().splitlines()

          lines = [
              line.replace(
                  "pnpm install --no-frozen-lockfile",
                  "pnpm install --frozen-lockfile",
              )
              for line in lines
          ]

          start = next(
              i
              for i, line in enumerate(lines)
              if "Check formatting for maintained CI and web test files" in line
          )
          end = next(
              i
              for i, line in enumerate(lines[start + 1 :], start + 1)
              if "pnpm typecheck" in line
          )

          lines[start:end] = ["      - run: pnpm format:check"]
          path.write_text("\n".join(lines) + "\n")
          PY
      - run: pnpm exec prettier --write .
      - name: Commit canonical baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Baseline already canonical."
            exit 0
          fi
          git commit -m "chore: establish formatting and lockfile baseline"
          git push origin HEAD:chore/format-lockfile-baseline
