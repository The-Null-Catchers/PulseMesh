name: Generate baseline

on:
  push:
    branches:
      - chore/format-lockfile-baseline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/format-lockfile-baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write .
      - name: Commit canonical baseline
        run: |
          git checkout -- .github/workflows/ci.yml .github/workflows/generate-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Baseline already canonical."
            exit 0
          fi
          git commit -m "chore: establish formatting and lockfile baseline"
          git push origin HEAD:chore/format-lockfile-baseline
