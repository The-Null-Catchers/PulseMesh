name: Generate baseline

on:
  push:
    branches:
      - chore/format-lockfile-baseline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/format-lockfile-baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Promote strict CI baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text()
          text = text.replace(
              "      - run: pnpm install --no-frozen-lockfile",
              "      - run: pnpm install --frozen-lockfile",
          )
          old = """      - name: Check formatting for maintained CI and web test files
        run: >-
          pnpm exec prettier --check
          .github/workflows/ci.yml
          apps/web/package.json
          apps/web/lib/session.ts
          apps/web/lib/session.test.ts"""
          text = text.replace(old, "      - run: pnpm format:check")
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write .
      - name: Commit canonical baseline
        run: |
          if git diff --quiet && git diff --cached --quiet && git status --porcelain | grep -qv '^?? pnpm-lock.yaml$'; then
            echo "Baseline already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore: establish formatting and lockfile baseline"
          git push origin HEAD:chore/format-lockfile-baseline
