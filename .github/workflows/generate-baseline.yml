name: Generate baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write .
      - name: Build baseline archive
        run: |
          mkdir -p /tmp/pulsemesh-baseline
          git ls-files -z | xargs -0 -I{} sh -c 'mkdir -p "/tmp/pulsemesh-baseline/$(dirname "{}")"; cp "{}" "/tmp/pulsemesh-baseline/{}"'
          cp pnpm-lock.yaml /tmp/pulsemesh-baseline/pnpm-lock.yaml
          tar -C /tmp/pulsemesh-baseline -czf pulsemesh-baseline.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pulsemesh-baseline
          path: pulsemesh-baseline.tar.gz
          if-no-files-found: error
