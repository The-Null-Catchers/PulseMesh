name: Apply mobile saved messages wiring

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-saved-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-saved-messages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply wiring
        run: python3 scripts/wire_mobile_saved_messages.py
      - name: Format wiring
        run: dart format apps/mobile/lib/main.dart apps/mobile/lib/features/messages/saved_message.dart apps/mobile/lib/features/messages/saved_messages_screen.dart apps/mobile/lib/features/messages/message_actions_transport.dart apps/mobile/test/saved_message_test.dart
      - name: Validate patch
        run: git diff --check
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/main.dart apps/mobile/lib/features/messages apps/mobile/test/saved_message_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(mobile): wire saved messages navigation"
          git push origin HEAD:feat/mobile-saved-messages
