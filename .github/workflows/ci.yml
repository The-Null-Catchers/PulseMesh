name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Check formatting for maintained CI and web test files
        run: >-
          pnpm exec prettier --check
          .github/workflows/ci.yml
          apps/web/package.json
          apps/web/lib/session.ts
          apps/web/lib/session.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infrastructure/docker/api.Dockerfile .
      - run: docker build -f infrastructure/docker/worker.Dockerfile .
      - run: docker build -f infrastructure/docker/web.Dockerfile .
