name: Wire mobile saved messages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wire-saved-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-saved-messages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Wire saved messages into the app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/lib/main.dart')
          text = path.read_text()

          text = text.replace(
              "import 'features/messages/room_screen.dart';\n",
              "import 'features/messages/message_actions_transport.dart';\n"
              "import 'features/messages/room_screen.dart';\n"
              "import 'features/messages/saved_messages_screen.dart';\n",
              1,
          )

          text = text.replace(
              "  late final CallTransport _callTransport;\n",
              "  late final CallTransport _callTransport;\n"
              "  late final MessageActionsTransport _messageActionsTransport;\n",
              1,
          )

          text = text.replace(
              "    _callTransport = DioCallTransport(\n"
              "      baseUrl: widget.config.apiBaseUrl,\n"
              "      accessToken: widget.authSession.accessToken,\n"
              "    );\n"
              "    unawaited(_controller.initialize());\n",
              "    _callTransport = DioCallTransport(\n"
              "      baseUrl: widget.config.apiBaseUrl,\n"
              "      accessToken: widget.authSession.accessToken,\n"
              "    );\n"
              "    _messageActionsTransport = DioMessageActionsTransport(\n"
              "      baseUrl: widget.config.apiBaseUrl,\n"
              "      accessToken: widget.authSession.accessToken,\n"
              "    );\n"
              "    unawaited(_controller.initialize());\n",
              1,
          )

          text = text.replace(
              "    return MobileDataScope(\n"
              "      controller: _controller,\n"
              "      child: PulseMeshApp(callTransport: _callTransport),\n"
              "    );\n",
              "    return SavedMessagesTransportScope(\n"
              "      transport: _messageActionsTransport,\n"
              "      child: MobileDataScope(\n"
              "        controller: _controller,\n"
              "        child: PulseMeshApp(callTransport: _callTransport),\n"
              "      ),\n"
              "    );\n",
              1,
          )

          text = text.replace(
              "    GoRoute(\n"
              "      path: '/voice/:id',\n",
              "    GoRoute(\n"
              "      path: '/saved',\n"
              "      builder: (_, _) => const SavedMessagesScreen(),\n"
              "    ),\n"
              "    GoRoute(\n"
              "      path: '/voice/:id',\n",
              1,
          )

          old_appbar = """          const SliverAppBar(
            floating: true,
            backgroundColor: Color(0xFF071015),
            title: Text(
              'Messages',
              style: TextStyle(fontWeight: FontWeight.w800),
            ),
          ),
"""
          new_appbar = """          SliverAppBar(
            floating: true,
            backgroundColor: const Color(0xFF071015),
            title: const Text(
              'Messages',
              style: TextStyle(fontWeight: FontWeight.w800),
            ),
            actions: [
              IconButton(
                tooltip: 'Saved messages',
                onPressed: () => context.push('/saved'),
                icon: const Icon(Icons.bookmark_outline_rounded),
              ),
              const SizedBox(width: 4),
            ],
          ),
"""
          if old_appbar not in text:
              raise SystemExit('Messages SliverAppBar anchor not found')
          text = text.replace(old_appbar, new_appbar, 1)

          path.write_text(text)
          PY
          dart format apps/mobile/lib/main.dart apps/mobile/lib/features/messages/saved_message.dart apps/mobile/lib/features/messages/saved_messages_screen.dart apps/mobile/lib/features/messages/message_actions_transport.dart apps/mobile/test/saved_message_test.dart
          git diff --check
          git diff -- apps/mobile/lib/main.dart
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/main.dart apps/mobile/lib/features/messages apps/mobile/test/saved_message_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(mobile): wire saved messages navigation"
          git push origin HEAD:feat/mobile-saved-messages
