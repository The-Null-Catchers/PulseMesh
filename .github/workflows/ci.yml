name: Render mobile saved messages wiring

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-saved-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply wiring
        run: python3 scripts/wire_mobile_saved_messages.py
      - name: Format wiring
        run: dart format apps/mobile/lib/main.dart apps/mobile/lib/features/messages/saved_message.dart apps/mobile/lib/features/messages/saved_messages_screen.dart apps/mobile/lib/features/messages/message_actions_transport.dart apps/mobile/test/saved_message_test.dart
      - name: Validate patch
        run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-saved-wiring
          path: apps/mobile/lib/main.dart
          if-no-files-found: error
