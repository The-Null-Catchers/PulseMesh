services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulsemesh
      POSTGRES_USER: pulsemesh
      POSTGRES_PASSWORD: pulsemesh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsemesh -d pulsemesh"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  coturn:
    image: coturn/coturn:latest
    command:
      - -n
      - --log-file=stdout
      - --realm=\${TURN_REALM:-pulsemesh.local}
      - --user=\${TURN_USER:-pulsemesh}:\${TURN_PASSWORD:-change-turn-password}
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulsemesh:pulsemesh@postgres:5432/pulsemesh
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulsemesh:pulsemesh@postgres:5432/pulsemesh
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: \${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: \${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/realtime}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
